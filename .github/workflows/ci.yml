name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request supersedes its running checks; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Third-party actions are pinned to full commit SHAs (the tag in the comment); Dependabot proposes
# updates (.github/dependabot.yml). The gate job names are the required checks on main: renaming
# one means updating the branch protection too. Steps arrive with their first subject. OpenAPI drift is
# an apps/api test (openapi.test.ts), run by pnpm test. E2E runs the built front ends in Playwright's
# Chromium, split over parallel shards, and uploads their RTL screenshots.
# Turborepo's remote cache (docs/testing.md, "CI") is on once the repository has the TURBO_TOKEN and
# TURBO_REMOTE_CACHE_SIGNATURE_KEY secrets and the TURBO_TEAM variable (TURBO_API for a cache other
# than Vercel's). Only the jobs that run turbo get them. Until then, and for pull requests without
# secrets, each job keeps its own cache (actions/cache).
jobs:
  # Pull requests that change only Markdown no check reads (everything outside brand/) skip the
  # checks; the gate job below still reports, so branch protection and auto-merge work.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          code=true
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BASE" HEAD)
            if [ -n "$changed" ] && ! echo "$changed" | grep -qvE '\.md$' && ! echo "$changed" | grep -q '^brand/'; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Checks needed: $code"

  static:
    name: Lint, typecheck, build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_ADMIN_URL: postgres://postgres:ci-only-admin-password@localhost:5432/postgres
      DATABASE_OWNER_URL: postgres://shifa_owner:ci-only-owner-password@localhost:5432/vertex_shifa
      DATABASE_APP_URL: postgres://shifa_app:ci-only-app-password@localhost:5432/vertex_shifa
      DATABASE_JOBS_URL: postgres://shifa_jobs:ci-only-jobs-password@localhost:5432/vertex_shifa
      DATABASE_QUEUE_URL: postgres://shifa_queue:ci-only-queue-password@localhost:5432/vertex_shifa
      # No check launches Electron: typecheck, tests and the build need only its types.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # Next.js sends no usage telemetry from CI.
      NEXT_TELEMETRY_DISABLED: '1'
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_API: ${{ vars.TURBO_API || 'https://vercel.com/api' }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Turborepo's cache across runs: tasks whose inputs did not change are replayed, not rerun. A
      # pull request reads its own runs' cache and main's; main cannot read a pull request's (GitHub
      # keeps caches per branch), so after a merge main runs what the pull request changed once more.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ github.job }}-
      - name: No known high-severity advisory in production dependencies
        run: pnpm audit --prod --audit-level=high
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      # Migrations are generated from the Drizzle schema and never edited (ADR 0020): generating
      # again must change nothing.
      - name: Migrations match the schema
        run: |
          pnpm db:generate
          git diff --exit-code -- packages/db/migrations
          test -z "$(git status --porcelain -- packages/db/migrations)"
      # The cache only grows (each run adds its new task results): start over past 1.5 GB.
      - name: Keep the Turborepo cache small
        if: always()
        run: |
          if [ -d .turbo/cache ] && [ "$(du -sm .turbo/cache | cut -f1)" -gt 1500 ]; then rm -rf .turbo/cache; fi

  test:
    name: Tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A throwaway PostgreSQL 17 for the database tests; the passwords are fake and exist only
    # for this job.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-admin-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      DATABASE_ADMIN_URL: postgres://postgres:ci-only-admin-password@localhost:5432/postgres
      DATABASE_OWNER_URL: postgres://shifa_owner:ci-only-owner-password@localhost:5432/vertex_shifa
      DATABASE_APP_URL: postgres://shifa_app:ci-only-app-password@localhost:5432/vertex_shifa
      DATABASE_JOBS_URL: postgres://shifa_jobs:ci-only-jobs-password@localhost:5432/vertex_shifa
      DATABASE_QUEUE_URL: postgres://shifa_queue:ci-only-queue-password@localhost:5432/vertex_shifa
      # No check launches Electron: typecheck, tests and the build need only its types.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # Next.js sends no usage telemetry from CI.
      NEXT_TELEMETRY_DISABLED: '1'
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_API: ${{ vars.TURBO_API || 'https://vercel.com/api' }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Turborepo's cache across runs: tasks whose inputs did not change are replayed, not rerun. A
      # pull request reads its own runs' cache and main's; main cannot read a pull request's (GitHub
      # keeps caches per branch), so after a merge main runs what the pull request changed once more.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ github.job }}-
      - name: Database roles and development database
        run: pnpm db:setup-local
      - name: Migrations apply to the development database
        run: pnpm db:migrate
      - run: pnpm test
      # The cache only grows (each run adds its new task results): start over past 1.5 GB.
      - name: Keep the Turborepo cache small
        if: always()
        run: |
          if [ -d .turbo/cache ] && [ "$(du -sm .turbo/cache | cut -f1)" -gt 1500 ]; then rm -rf .turbo/cache; fi

  # Every app's E2E split over four runners (Playwright --shard, applied to each app's suite).
  e2e:
    name: E2E shard ${{ matrix.shard }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      DATABASE_ADMIN_URL: postgres://postgres:ci-only-admin-password@localhost:5432/postgres
      DATABASE_OWNER_URL: postgres://shifa_owner:ci-only-owner-password@localhost:5432/vertex_shifa
      DATABASE_APP_URL: postgres://shifa_app:ci-only-app-password@localhost:5432/vertex_shifa
      DATABASE_JOBS_URL: postgres://shifa_jobs:ci-only-jobs-password@localhost:5432/vertex_shifa
      DATABASE_QUEUE_URL: postgres://shifa_queue:ci-only-queue-password@localhost:5432/vertex_shifa
      # No check launches Electron: typecheck, tests and the build need only its types.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # Next.js sends no usage telemetry from CI.
      NEXT_TELEMETRY_DISABLED: '1'
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_API: ${{ vars.TURBO_API || 'https://vercel.com/api' }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Turborepo's cache across runs: tasks whose inputs did not change are replayed, not rerun. A
      # pull request reads its own runs' cache and main's; main cannot read a pull request's (GitHub
      # keeps caches per branch), so after a merge main runs what the pull request changed once more.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ github.job }}-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: turbo-${{ github.job }}-${{ matrix.shard }}-
      # One Chromium serves every app's E2E: they share the @playwright/test version and its cache.
      - name: Playwright browser
        run: pnpm --filter @vertex-shifa/clinic exec playwright install --with-deps chromium
      - run: pnpm turbo run test:e2e -- --shard=${{ matrix.shard }}/4
      - name: E2E screenshots and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results-${{ matrix.shard }}
          path: apps/*/test-results/
          if-no-files-found: ignore
          retention-days: 14
      # The cache only grows (each run adds its new task results): start over past 1.5 GB.
      - name: Keep the Turborepo cache small
        if: always()
        run: |
          if [ -d .turbo/cache ] && [ "$(du -sm .turbo/cache | cut -f1)" -gt 1500 ]; then rm -rf .turbo/cache; fi

  # The check branch protection requires: it passes when every job behind it passed or was
  # skipped (documentation only), and fails otherwise.
  checks:
    name: Typecheck, lint, test, build
    needs: [changes, static, test, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          ! echo "$NEEDS" | grep -qE '"result": "(failure|cancelled)"'

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
