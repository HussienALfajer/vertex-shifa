name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request supersedes its running checks; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Third-party actions are pinned to full commit SHAs (the tag in the comment); Dependabot proposes
# updates (.github/dependabot.yml). The job names are the required checks on main: renaming one
# means updating the branch protection too. Steps arrive with their first subject. OpenAPI drift is
# an apps/api test (openapi.test.ts), run by pnpm test. E2E runs the built front ends in Playwright's
# Chromium and uploads their RTL screenshots.
jobs:
  checks:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # A throwaway PostgreSQL 17 for the database tests; the passwords are fake and exist only
    # for this job.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-admin-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      DATABASE_ADMIN_URL: postgres://postgres:ci-only-admin-password@localhost:5432/postgres
      DATABASE_OWNER_URL: postgres://shifa_owner:ci-only-owner-password@localhost:5432/vertex_shifa
      DATABASE_APP_URL: postgres://shifa_app:ci-only-app-password@localhost:5432/vertex_shifa
      DATABASE_JOBS_URL: postgres://shifa_jobs:ci-only-jobs-password@localhost:5432/vertex_shifa
      DATABASE_QUEUE_URL: postgres://shifa_queue:ci-only-queue-password@localhost:5432/vertex_shifa
      # No check launches Electron: typecheck, tests and the build need only its types.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: No known high-severity advisory in production dependencies
        run: pnpm audit --prod --audit-level=high
      - run: pnpm lint
      - name: Database roles and development database
        run: pnpm db:setup-local
      - name: Migrations apply to the development database
        run: pnpm db:migrate
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Playwright browser
        run: pnpm --filter @vertex-shifa/clinic exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: E2E screenshots and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: apps/*/test-results/
          if-no-files-found: ignore
          retention-days: 14
      # Migrations are generated from the Drizzle schema and never edited (ADR 0020): generating
      # again must change nothing.
      - name: Migrations match the schema
        run: |
          pnpm db:generate
          git diff --exit-code -- packages/db/migrations
          test -z "$(git status --porcelain -- packages/db/migrations)"

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
