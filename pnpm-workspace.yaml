# spikes/ hold throwaway code with their own workspaces and lockfiles; they are not part of this one.
packages:
  - apps/*
  - packages/*

# Supply-chain guard: only install versions published at least 24 hours ago.
minimumReleaseAge: 1440

# Dependencies allowed to run install scripts. Everything else is blocked; a package that needs one
# is added here with a reason, and one that works without its script is listed as false.
allowBuilds:
  # Its install script only checks the platform binary, which the optional @esbuild/* package
  # already provides (used by drizzle-kit, tsx and vite).
  esbuild: false
  # Downloads the Electron binary for apps/clinic (dev and start). CI typechecks, tests and builds
  # without launching it and skips the download (ELECTRON_SKIP_BINARY_DOWNLOAD).
  electron: true

# Advisories `pnpm audit --prod` (CI) accepts. Either no patched version exists and the package is
# reachable only through build tools that Expo and React Native declare as runtime dependencies (it
# reaches no app bundle or server): remove the entry when a patched version ships. Or the fix is
# applied in place by `patches/` (`patchedDependencies` below): the entry names the patch and the
# version it covers, and a test fails if another, unpatched version enters the tree.
auditConfig:
  ignoreGhsas:
    # node-forge signature verification: @expo/cli (developer and EAS machines, code signing of updates).
    - GHSA-86w9-cpqp-85rv
    # zod memory exhaustion on oversized constrained collections: @expo/cli's zod 3 (developer and EAS
    # machines, its own config); fixed only in zod 4.6.6, and every @expo/cli depends on zod ^3. The
    # apps and packages use zod ^4.6.7.
    - GHSA-mrhx-c7xc-m3w5
    # braces stack exhaustion on nested patterns: Metro's file map (bundling only; patterns are ours).
    - GHSA-vfj7-8cjw-p6xm
    # decode-uri-component exponential decoding: expo-router > query-string@7 (the patient app's
    # links). Its fix (0.5.0) is ESM-only, which query-string@7's `require` cannot load, so
    # patches/decode-uri-component@0.2.2.patch carries the fix into 0.2.2, the only version allowed
    # in the tree (apps/patient/test/query-decoding.test.ts).
    # Remove both when expo-router no longer depends on query-string@7 (Expo SDK 58).
    - GHSA-vcc3-ghjq-m6fr

# Versions forced over what a dependency pins. Remove an entry once the dependency itself requires
# the version.
overrides:
  # @nestjs/platform-express pins multer 2.4.0 (GHSA-q7qp-rjg7-q26m, a denial of service through an
  # asynchronous fileFilter after the request ends): the API's logo and doctor photo uploads.
  multer: ^2.5.0

patchedDependencies:
  decode-uri-component@0.2.2: patches/decode-uri-component@0.2.2.patch
